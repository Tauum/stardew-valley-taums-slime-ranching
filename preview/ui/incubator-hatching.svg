<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" role="img" aria-labelledby="title desc">
  <title id="title">Current Slime Incubator active hatch menu</title>
  <desc id="desc">Static offline representation of the implemented incubator screen during hatching and when the Daycare is full.</desc>
  <defs><linearGradient id="frame" x2="0" y2="1"><stop stop-color="#f2e6c8"/><stop offset=".2" stop-color="#9b7950"/><stop offset=".5" stop-color="#e8d7b6"/><stop offset=".8" stop-color="#9b7950"/><stop offset="1" stop-color="#e9ddc2"/></linearGradient><style>.t{font-family:Georgia,serif;fill:#493523}.s{font-family:Arial,sans-serif;fill:#493523}.light{fill:#fff}</style></defs>
  <rect width="700" height="480" rx="16" fill="#17131a"/><rect x="10" y="10" width="680" height="460" rx="18" fill="url(#frame)" stroke="#65482e" stroke-width="7"/>
  <text class="t" x="350" y="55" text-anchor="middle" font-size="30">Slime Incubator</text><text class="s" x="34" y="94" font-size="15">Choose a Common or genome-specific Domesticated Slime Egg. Standard hatch time: 7 days.</text>
  <rect x="36" y="140" width="628" height="260" rx="12" fill="#30345d" stroke="#876d9d" stroke-width="4"/>
  <g stroke="#253c62" stroke-width="5"><rect x="52" y="197" width="130" height="134" rx="34" fill="#16b7ec"/><rect x="45" y="182" width="144" height="26" rx="10" fill="#8c9cad"/><rect x="45" y="328" width="144" height="37" rx="10" fill="#65748b"/><rect x="187" y="218" width="48" height="120" rx="8" fill="#495879"/></g>
  <path d="M117 278c-24-20-48 10-23 31l23 23 23-23c25-21 1-51-23-31z" fill="#d8efad" stroke="#70944c" stroke-width="4"/><circle cx="211" cy="250" r="11" fill="#65d9fa"/><path d="M203 284l16 10-16 10z" fill="#ed9a3e"/><rect x="202" y="312" width="18" height="4" fill="#ed9a3e"/>
  <rect x="306" y="148" width="342" height="244" rx="10" fill="#494d7e" stroke="#9880ae" stroke-width="3"/><text class="s light" x="324" y="184" font-size="14">HATCHING...</text><text class="t" x="324" y="225" font-size="24">Azure Slime Egg</text><text class="s light" x="324" y="275" font-size="14">Incubating - 14 days remaining</text>
  <rect x="324" y="298" width="306" height="24" rx="7" fill="#5b4b3a"/><rect x="328" y="302" width="42" height="16" rx="4" fill="#709e59"/><text class="s light" x="477" y="344" text-anchor="middle" font-size="13">1 / 7 days (14%)</text>
  <text class="s light" x="52" y="385" font-size="12">Temperature</text><rect x="166" y="374" width="182" height="15" rx="5" fill="#19264a"/><rect x="170" y="378" width="88" height="7" rx="3" fill="#2fc7ea"/><text class="s" x="550" y="448" font-size="13">Esc: close</text><text x="16" y="466" font-family="Arial" font-size="10" fill="#665643">OFFLINE PREVIEW OF CURRENT IMPLEMENTED MENU</text>
</svg>
