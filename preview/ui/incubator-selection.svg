<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" role="img" aria-labelledby="title desc">
  <title id="title">Current Slime Incubator egg-selection menu</title>
  <desc id="desc">Static offline representation of the implemented 700 by 480 incubator menu before starting a hatch.</desc>
  <defs><linearGradient id="frame" x2="0" y2="1"><stop stop-color="#f2e6c8"/><stop offset=".2" stop-color="#9b7950"/><stop offset=".5" stop-color="#e8d7b6"/><stop offset=".8" stop-color="#9b7950"/><stop offset="1" stop-color="#e9ddc2"/></linearGradient><style>.t{font-family:Georgia,serif;fill:#493523}.s{font-family:Arial,sans-serif;fill:#493523}.row{fill:#eee0bf;stroke:#98764f;stroke-width:3}</style></defs>
  <rect width="700" height="480" rx="16" fill="#17131a"/><rect x="10" y="10" width="680" height="460" rx="18" fill="url(#frame)" stroke="#65482e" stroke-width="7"/>
  <text class="t" x="350" y="55" text-anchor="middle" font-size="30">Slime Incubator</text><text class="s" x="34" y="94" font-size="15">Choose a genome-specific Ranch Slime Egg. Standard hatch time: 7 days.</text>
  <g class="s" font-size="15"><rect class="row" x="26" y="132" width="365" height="48" rx="5"/><circle cx="54" cy="155" r="13" fill="#d4edc0" stroke="#9b7950" stroke-width="2"/><text x="78" y="151">Verdant Slime Egg</text><text x="78" y="169" font-size="11">Inventory stack: 1</text>
  <rect class="row" x="26" y="184" width="365" height="48" rx="5"/><circle cx="54" cy="207" r="13" fill="#8dddf0" stroke="#51899d" stroke-width="2"/><text x="78" y="203">Azure Slime Egg</text><text x="78" y="221" font-size="11">Inventory stack: 1</text>
  <rect class="row" x="26" y="236" width="365" height="48" rx="5"/><circle cx="54" cy="259" r="13" fill="#f0a5c9" stroke="#a95f84" stroke-width="2"/><text x="78" y="255">Rose Slime Egg</text><text x="78" y="273" font-size="11">Inventory stack: 2</text>
  <rect class="row" x="26" y="288" width="365" height="48" rx="5"/><circle cx="54" cy="311" r="13" fill="#b1d782" stroke="#6f8d4e" stroke-width="2"/><text x="78" y="307">Moss Slime Egg</text><text x="78" y="325" font-size="11">Inventory stack: 1</text></g>
  <rect x="421" y="132" width="245" height="204" rx="12" fill="#e4d9bd" stroke="#9b7950" stroke-width="3"/><text class="s" x="543" y="166" text-anchor="middle" font-size="15" font-weight="bold">Select an egg</text><path d="M543 203c-30-27-54 5-28 32l28 30 28-30c26-27 2-59-28-32z" fill="#d4edc0" stroke="#799760" stroke-width="4"/><text class="s" x="543" y="294" text-anchor="middle" font-size="13">Click a row to start</text><text class="s" x="543" y="314" text-anchor="middle" font-size="13">the 7-day hatch.</text>
  <text class="s" x="34" y="412" font-size="13">Choose a row with an egg. The egg is removed when incubation starts.</text><text class="s" x="550" y="448" font-size="13">Esc: close</text><text x="16" y="466" font-family="Arial" font-size="10" fill="#665643">OFFLINE PREVIEW OF CURRENT IMPLEMENTED MENU</text>
</svg>
