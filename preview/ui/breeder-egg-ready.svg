<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Current Slime Breeder completed cycle menu</title>
  <desc id="desc">Static offline representation of the implemented breeder state with a finished egg waiting for manual collection.</desc>
  <defs><linearGradient id="frame" x2="0" y2="1"><stop stop-color="#f2e6c8"/><stop offset=".2" stop-color="#9b7950"/><stop offset=".5" stop-color="#e8d7b6"/><stop offset=".8" stop-color="#9b7950"/><stop offset="1" stop-color="#e9ddc2"/></linearGradient><style>.t{font-family:Georgia,serif;fill:#493523}.s{font-family:Arial,sans-serif;fill:#493523}.box{stroke:#8d704e;stroke-width:5;fill:#efe3c5}</style></defs>
  <rect width="800" height="560" rx="16" fill="#17131a"/><rect x="10" y="10" width="780" height="540" rx="18" fill="url(#frame)" stroke="#65482e" stroke-width="7"/>
  <text class="t" x="400" y="51" text-anchor="middle" font-size="30">Slime Breeder</text><text class="s" x="40" y="92" font-size="15">Choose two parents, then start the cycle to reserve them. Scroll the list for more.</text>
  <g class="s" font-size="15"><rect class="box" x="24" y="112" width="382" height="44" rx="5" fill="#d2d0c5"/><text x="38" y="140">[RESTING 1d] Azure Slime</text><rect class="box" x="24" y="160" width="382" height="44" rx="5" fill="#d2d0c5"/><text x="38" y="188">[RESTING 1d] Rose Slime</text><rect class="box" x="24" y="208" width="382" height="44" rx="5"/><text x="38" y="236">[  ] Green Slime</text><rect class="box" x="24" y="256" width="382" height="44" rx="5"/><text x="38" y="284">[  ] Gold Slime</text></g>
  <rect x="424" y="112" width="342" height="214" rx="10" fill="#bfddde" stroke="#8d704e" stroke-width="4"/><text class="s" x="595" y="145" text-anchor="middle" font-size="15" font-weight="bold">BREEDING CHAMBER</text>
  <ellipse cx="595" cy="234" rx="49" ry="52" fill="#dfc878" stroke="#967744" stroke-width="4"/><path d="M595 205c-20-20-43 2-22 24l22 24 22-24c21-22-2-44-22-24z" fill="#f5f0dc" stroke="#c19b4f" stroke-width="3"/>
  <text class="t" x="595" y="278" text-anchor="middle" font-size="21">EGG READY</text><text class="s" x="595" y="300" text-anchor="middle" font-size="13">Parents returned to the Daycare.</text><text class="s" x="595" y="318" text-anchor="middle" font-size="11">Collect the egg to use this breeder again.</text>
  <rect class="box" x="430" y="338" width="336" height="72" rx="8" fill="#f4e0b0"/><text class="s" x="446" y="367" font-size="15">Offspring color: inherited</text><text class="s" x="446" y="393" font-size="12">Click to choose a Chromatic Crystal.</text>
  <rect x="34" y="470" width="190" height="56" rx="10" fill="#b4dcae" stroke="#79976f" stroke-width="4"/><text class="s" x="129" y="505" text-anchor="middle" font-size="16" font-weight="bold">Collect Egg</text>
  <rect x="236" y="470" width="180" height="56" rx="10" fill="#ddc49d" stroke="#9b7950" stroke-width="4"/><text class="s" x="326" y="505" text-anchor="middle" font-size="16">Release Pair</text>
  <text class="s" x="430" y="500" font-size="14">Egg ready; parents returned.</text><text class="s" x="430" y="522" font-size="12">Esc: close</text><text x="16" y="547" font-family="Arial" font-size="10" fill="#665643">OFFLINE PREVIEW OF CURRENT IMPLEMENTED MENU</text>
</svg>
